<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴퍼니 타이쿤</title>
<!-- gh/ 경로는 404라 폰트가 안 붙는다. npm 배포본이 정식 경로. -->
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="dock"></div>
  <div id="news">
    <div id="news-log"></div>
    <span class="tag">속보</span>
    <span id="news-line">시장이 개장했습니다.</span>
    <button id="news-toggle">지난 소식 ▼</button>
  </div>
  <div id="stage">
    <div id="board">
      <div id="canvas-wrap"><canvas id="cv"></canvas></div>
      <span id="board-hint"></span>
    </div>
  </div>
</div>
<div id="panel-layer">
  <div id="panel-win">
    <div id="panel-head"><span id="panel-title"></span><button id="panel-x">✕</button></div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>
<div id="modal-layer"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
